[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-rag-system-v2"
version = "0.1.0"
description = "A clean multi-agent RAG prototype with inspectable workflow stages."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zhuoying Li" }]
dependencies = [
  "pypdf>=4.2.0",
]

[project.scripts]
rag-agent = "multi_agent_rag.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

