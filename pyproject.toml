[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-rag-system-v2"
version = "0.1.0"
description = "A clean multi-agent RAG prototype with inspectable workflow stages."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zhuoying Li" }]
dependencies = [
  "anyio>=4.0.0",
  "fastapi>=0.110.0",
  "pypdf>=4.2.0",
  "uvicorn[standard]>=0.27.0",
]

[project.scripts]
rag-agent = "multi_agent_rag.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
production = [
  "langgraph>=0.2.0",
  "neo4j>=5.0.0",
  "qdrant-client>=1.9.0",
  "sentence-transformers>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]



